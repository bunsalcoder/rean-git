name: Site checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify English content copies match sources
        run: ./scripts/check_content_sync.sh
      - name: Verify Khmer content structure vs English
        run: ./scripts/check_km_content_sync.sh
      - name: Verify locales, content coverage, and internal links
        run: ./scripts/check_site_quality.sh
      - name: Install Git LFS for submodule/LFS lab fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install
      - name: Run lab verify.sh against fixture playgrounds
        run: ./scripts/run_lab_verifier_fixtures.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
