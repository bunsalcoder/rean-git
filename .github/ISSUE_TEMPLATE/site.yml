name: Site bug
description: Something broken on the website
title: "[site] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected vs what you saw
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://bunsalcoder.github.io/rean-git/learn.html
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Khmer
        - Both / not sure
