      rel="stylesheet"
    />
    <script>
      (function () {
        var t = localStorage.getItem("rean-git-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("rean-git-lang");
        if (l === "km" || l === "en") {
          document.documentElement.setAttribute("lang", l);
          document.documentElement.setAttribute("data-lang", l);
        }
      })();
    </script>
    <link rel="stylesheet" href="./assets/css/styles.css" />

    <header class="site-header site-header-bar">

          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">

            Chapters
          </button>
