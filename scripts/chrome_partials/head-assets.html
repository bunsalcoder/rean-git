<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="./assets/img/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#f3f5f7" />
<link
  rel="preload"
  href="./assets/fonts/epilogue-latin.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="./assets/fonts/ibm-plex-mono-400-latin.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<script>
  (function () {
    var pref = localStorage.getItem("rean-git-theme");
    if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
    document.documentElement.setAttribute("data-theme-pref", pref);
    var t =
      pref === "dark" || pref === "light"
        ? pref
        : matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    document.documentElement.setAttribute("data-theme", t);
    var themeMeta = document.querySelector('meta[name="theme-color"]');
    if (themeMeta) themeMeta.setAttribute("content", t === "dark" ? "#2f3644" : "#f3f5f7");
    var l = localStorage.getItem("rean-git-lang");
    if (l === "km" || l === "en") {
      document.documentElement.setAttribute("lang", l);
      document.documentElement.setAttribute("data-lang", l);
    }
    if (l === "km") {
      var kmFont = document.createElement("link");
      kmFont.rel = "preload";
      kmFont.href = "./assets/fonts/kantumruy-pro-khmer.woff2";
      kmFont.as = "font";
      kmFont.type = "font/woff2";
      kmFont.crossOrigin = "anonymous";
      document.head.appendChild(kmFont);
    }
    try {
      document.cookie =
        "rean-git-lang=" +
        (l === "km" ? "km" : "en") +
        "; path=/; max-age=31536000; SameSite=Lax";
    } catch (e) {
      /* private mode */
    }
  })();
</script>
<link rel="stylesheet" href="./assets/css/styles.css" />
