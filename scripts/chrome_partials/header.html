<a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">Skip to content</a>
<header class="site-header site-header-bar">
  <div class="wrap header-inner">
    <a class="logo" href="{{LOGO_HREF}}">rean<span>-git</span></a>
    <nav class="nav" data-nav id="site-nav">
      <a href="./index.html"{{NAV_HOME}} data-i18n="nav.home">Home</a>
      <a href="./learn.html"{{NAV_LEARN}} data-i18n="nav.learn">Learn</a>
      <a href="./labs.html"{{NAV_LABS}} data-i18n="nav.labs">Labs</a>
      <a href="{{CHEAT_SHEET_HREF}}" data-cheat-sheet data-i18n="nav.cheatSheet">Cheat sheet</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch" role="group" data-i18n="nav.language" data-i18n-attr="aria-label" aria-label="Language">
        <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="km" aria-pressed="false">ខ្មែរ</button>
      </div>
      <button class="search-toggle" type="button" data-search-toggle data-i18n="nav.search" data-i18n-attr="aria-label" aria-label="Search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16.5 20.5 21" />
        </svg>
      </button>
      <button class="theme-toggle" type="button" data-theme-toggle data-i18n="nav.themeToDark" data-i18n-attr="aria-label" aria-label="Switch to dark mode">
        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g class="theme-sun">
            <circle class="theme-sun-core" cx="12" cy="12" r="4" />
            <g class="theme-sun-rays">
              <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56" />
            </g>
          </g>
          <path
            class="theme-moon"
            d="M21 14.12A9 9 0 0 1 9.88 3 7.5 7.5 0 1 0 21 14.12Z"
          />
        </svg>
      </button>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" data-i18n="nav.menu" data-i18n-attr="aria-label" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
<script>
  (function () {
    var lang = document.documentElement.getAttribute("data-lang");
    if (lang !== "km") {
      document.documentElement.setAttribute("data-i18n-ready", "");
      return;
    }
    var chrome = {
      "a11y.skipToContent": "រំលងទៅមាតិកា",
      "nav.home": "ទំព័រដើម",
      "nav.learn": "រៀន",
      "nav.labs": "លំហាត់",
      "nav.cheatSheet": "តារាងសង្ខេប",
      "nav.menu": "ម៉ឺនុយ",
      "nav.language": "ភាសា",
      "nav.search": "ស្វែងរក",
      "nav.themeToLight": "ប្តូរទៅរបៀបភ្លឺ",
      "nav.themeToDark": "ប្តូរទៅរបៀបងងឹត",
    };
    document.querySelectorAll(".skip-link[data-i18n], .site-header [data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      var value = chrome[key];
      if (!value) return;
      var attr = el.getAttribute("data-i18n-attr");
      if (attr) el.setAttribute(attr, value);
      else el.textContent = value;
    });
    document.querySelectorAll(".lang-switch [data-set-lang]").forEach(function (btn) {
      var active = btn.getAttribute("data-set-lang") === "km";
      btn.setAttribute("aria-pressed", String(active));
      btn.classList.toggle("is-active", active);
    });
  })();
</script>
